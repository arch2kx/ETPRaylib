name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel_suffix:
        description: >-
          Push to test channels instead of the live ones, e.g. "-test" sends
          builds to linux-test / windows-test / macos-test. Leave empty to
          only build without publishing.
        required: false
        default: '-test'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 rather than latest: the binary then needs only glibc 2.35,
          # which covers Ubuntu 22.04, Debian 12 and everything newer. Building
          # on a current runner raises the floor to 2.38 and locks those out.
          - os: ubuntu-22.04
            name: Linux
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxext-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols \
            meson ninja-build

      # 22.04 ships wayland-protocols 1.25, but GLFW 3.4 needs
      # fractional-scale-v1.xml, added in 1.31. The package is just XML plus a
      # .pc file, so installing a newer one is cheap and keeps the glibc floor.
      - name: Install newer wayland-protocols (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          ver=1.36
          curl -fsSL -o wp.tar.xz \
            "https://gitlab.freedesktop.org/wayland/wayland-protocols/-/releases/${ver}/downloads/wayland-protocols-${ver}.tar.xz"
          tar xf wp.tar.xz
          meson setup wp-build "wayland-protocols-${ver}" --prefix=/usr/local
          sudo meson install -C wp-build
          echo "PKG_CONFIG_PATH=/usr/local/share/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          # macos-latest is arm64, so a default build leaves Intel Macs with
          # a binary they cannot run. Build both slices into one universal
          # app; the deployment target keeps the x86_64 slice usable on the
          # older Macs that are the reason for building it at all.
          if [ "$RUNNER_OS" = "macOS" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        run: cmake --build build --config Release --parallel

      # raylib defaults GLFW_BUILD_WAYLAND to OFF, so an X11-only build is
      # the silent failure mode here - it still works, just via XWayland.
      # GLFW dlopens both, so check the library names it will reach for.
      - name: Verify both display backends (Linux)
        if: runner.os == 'Linux'
        run: |
          for lib in libwayland-client.so.0 libX11.so.6 libxkbcommon.so.0; do
            if ! strings build/ETP | grep -qx "$lib"; then
              echo "::error::$lib missing - GLFW was not built with both backends"
              exit 1
            fi
            echo "ok: $lib"
          done

      - name: Verify universal binary (macOS)
        if: runner.os == 'macOS'
        run: |
          archs=$(lipo -archs build/ETP.app/Contents/MacOS/ETP)
          echo "archs: $archs"
          for want in x86_64 arm64; do
            case " $archs " in
              *" $want "*) echo "ok: $want" ;;
              *) echo "::error::$want slice missing - not a universal binary"; exit 1 ;;
            esac
          done

      - name: Verify glibc floor (Linux)
        if: runner.os == 'Linux'
        run: |
          # The highest GLIBC_ symbol version the binary references is the
          # oldest distro it can run on. Keep it at or below 2.35.
          max=$(objdump -T build/ETP | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -uV | tail -1)
          echo "requires $max"
          lowest=$(printf '%s\nGLIBC_2.35\n' "$max" | sort -uV | tail -1)
          if [ "$lowest" != "GLIBC_2.35" ]; then
            echo "::error::binary needs $max, above the GLIBC_2.35 floor"
            exit 1
          fi
          echo "ok: within GLIBC_2.35"

      - name: Determinism test
        shell: bash
        run: |
          cmake --build build --target determinism_test --parallel --config Release
          bin=./build/determinism_test
          [ -x "$bin" ] || bin=./build/Release/determinism_test.exe
          # Runs headless - no window, no GL context, no display needed.
          "$bin" "hash-${{ matrix.name }}.txt"
          cat "hash-${{ matrix.name }}.txt"

      - name: Upload determinism hashes
        uses: actions/upload-artifact@v4
        with:
          name: hash-${{ matrix.name }}
          path: hash-${{ matrix.name }}.txt

      # The archives are packed flat - contents at the root, not nested in an
      # ETP/ folder. butler unpacks the zip and treats its root as the build
      # root, and .itch.toml is only honoured there.

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp build/ETP dist/
          cp -r build/assets dist/assets
          cp assets/mikaIcon.png dist/icon.png
          cp packaging/linux/.itch.toml packaging/linux/README.txt dist/
          cp packaging/linux/play.sh packaging/linux/install-shortcut.sh dist/
          chmod +x dist/ETP dist/play.sh dist/install-shortcut.sh
          (cd dist && zip -r ../etp-linux.zip .)

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          cp -r build/ETP.app dist/
          cp packaging/macos/.itch.toml packaging/macos/README.txt dist/
          # Drag-to-install target for people who download the zip directly.
          # Excluded from the butler push, where it's meaningless.
          ln -s /Applications dist/Applications
          # -y stores the symlink as a symlink instead of following it
          (cd dist && zip -ry ../etp-macos.zip .)

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/ETP.exe dist/
          Copy-Item -Recurse build/Release/assets dist/assets
          Copy-Item packaging/windows/.itch.toml dist/
          Copy-Item packaging/windows/README.txt dist/
          Copy-Item packaging/windows/install-shortcut.ps1 dist/
          Copy-Item "packaging/windows/Install Shortcut.bat" dist/
          Compress-Archive -Path dist/* -DestinationPath etp-windows.zip

      # The runner is a real Windows box, so the shortcut installer can be
      # exercised for real rather than only reasoned about. Runs against the
      # packaged dist/, i.e. exactly what a user downloads.
      - name: Smoke test shortcut installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ETP_NO_PAUSE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Eden Treaty Pandemonium.lnk'
          $menu = Join-Path ([Environment]::GetFolderPath('Programs')) 'Eden Treaty Pandemonium.lnk'

          & 'dist\Install Shortcut.bat'
          if (-not (Test-Path $lnk))  { throw "Desktop shortcut was not created" }
          if (-not (Test-Path $menu)) { throw "Start Menu shortcut was not created" }

          # A shortcut that exists but points at the wrong place still fails
          # the user, so read it back and check where it aims.
          $shell = New-Object -ComObject WScript.Shell
          $read = $shell.CreateShortcut($lnk)
          $wantExe = (Resolve-Path 'dist/ETP.exe').Path
          $wantDir = (Resolve-Path 'dist').Path
          if ($read.TargetPath -ne $wantExe) {
            throw "TargetPath was '$($read.TargetPath)', expected '$wantExe'"
          }
          if ($read.WorkingDirectory.TrimEnd('\') -ne $wantDir.TrimEnd('\')) {
            throw "WorkingDirectory was '$($read.WorkingDirectory)', expected '$wantDir'"
          }

          & 'dist\Install Shortcut.bat' -Remove
          if (Test-Path $lnk)  { throw "Desktop shortcut survived -Remove" }
          if (Test-Path $menu) { throw "Start Menu shortcut survived -Remove" }

          Write-Host "Shortcut installer verified: create, target, workdir, remove."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: etp-${{ matrix.name }}
          path: |
            etp-linux.zip
            etp-macos.zip
            etp-windows.zip
          if-no-files-found: ignore

  determinism-crossplatform:
    name: Cross-platform determinism
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hash-*
          path: hashes
          merge-multiple: true

      - name: Compare hashes across platforms
        run: |
          set -euo pipefail
          ls -1 hashes
          for f in hashes/*.txt; do echo "--- $f"; cat "$f"; done
          # Replay verification only works if every platform computes the
          # same simulation, so the files must be byte-identical.
          first=""
          status=0
          for f in hashes/*.txt; do
            if [ -z "$first" ]; then first="$f"; continue; fi
            # --strip-trailing-cr: the Windows runner writes CRLF, which is
            # not a simulation difference.
            if ! diff -q --strip-trailing-cr "$first" "$f" > /dev/null; then
              echo "::error::$f differs from $first - simulation is not cross-platform deterministic"
              diff --strip-trailing-cr "$first" "$f" || true
              status=1
            fi
          done
          if [ "$status" -eq 0 ]; then
            echo "All platforms agree - replay verification is viable."
          fi
          exit "$status"

  publish:
    name: Publish to itch.io
    needs: build
    # Tags publish to the live channels; a manual run publishes only if you
    # gave it a channel suffix, so an empty suffix means "just build".
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.channel_suffix != '')
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install butler
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler
          chmod +x butler/butler
          echo "$PWD/butler" >> "$GITHUB_PATH"

      - name: Push builds to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          SUFFIX: ${{ inputs.channel_suffix }}
        run: |
          set -euo pipefail

          # Tag runs use the tag as the version; manual test runs get the
          # commit so repeated pushes stay distinguishable.
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-${GITHUB_SHA::7}"
          fi

          GAME=arch-kun/etp-raylib
          # --if-changed skips a no-op build if a tag gets re-run.
          # --fix-permissions is a safety net on the Linux executable bit.
          PUSH=(butler push --if-changed --fix-permissions --userversion "$VERSION")

          "${PUSH[@]}" artifacts/etp-Linux/etp-linux.zip     "${GAME}:linux${SUFFIX}"
          "${PUSH[@]}" artifacts/etp-Windows/etp-windows.zip "${GAME}:windows${SUFFIX}"
          # The Applications symlink is a drag-to-install affordance for the
          # raw zip only - the itch app installs the .app itself.
          "${PUSH[@]}" --ignore Applications \
            artifacts/etp-macOS/etp-macos.zip "${GAME}:macos${SUFFIX}"

          # Echo what actually landed on each channel, so a typo'd channel
          # name is visible in the log instead of silently creating a new one.
          # push returns once the upload finishes, while the build is still
          # processing server-side, so a channel can briefly not exist yet.
          for ch in linux windows macos; do
            target="${GAME}:${ch}${SUFFIX}"
            echo "--- ${target} ---"
            for attempt in 1 2 3 4 5 6; do
              out=$(butler status "$target" 2>&1) || true
              if ! grep -q "No channel" <<<"$out"; then
                echo "$out"
                break
              fi
              if [ "$attempt" -eq 6 ]; then
                echo "::warning::${target} still not visible after waiting; check the itch.io dashboard"
                echo "$out"
                break
              fi
              sleep 10
            done
          done
